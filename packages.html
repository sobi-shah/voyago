<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyago | Packages</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- AOS Animations -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#38BDF8',
                        accent: '#F97316'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Prevents favicon error on local file -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
        }
        .header-bg {
            background: linear-gradient(to right, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?q=80&w=2074&auto=format&fit=crop') center/cover no-repeat;
        }
        .card-hover {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <!-- Navigation -->
    <nav class="glass-nav sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center gap-2 text-white group">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary transform group-hover:-translate-y-1 transition-transform">
                        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.5 1.5c-.2.2-.2.6 0 .8L8 13l-3.5 3.5-2.2-.7c-.3-.1-.7 0-.9.2L.4 17c-.2.2-.2.6 0 .8L4 20l2.2 3.6c.2.2.6.2.8 0l1-1c.2-.2.3-.6.2-.9l-.7-2.2L11 16l4 5.8c.2.3.6.4.8.2l1.5-1.5c.3-.2.6-.6.5-1.1z"/>
                    </svg>
                    <span class="font-extrabold text-2xl tracking-tight font-display bg-clip-text text-transparent bg-gradient-to-r from-[#38BDF8] via-[#0EA5E9] to-[#F97316]">Voyago</span>
                </a>
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors font-medium">Home</a>
                    <a href="packages.html" class="text-secondary font-semibold">Packages</a>
                    <a href="booking.html" class="text-gray-300 hover:text-white transition-colors font-medium">Booking</a>
                    <div id="nav-auth-section" class="flex items-center gap-4">
                        <a href="login.html" class="text-gray-300 hover:text-white font-medium transition-colors">Login</a>
                        <a href="register.html" class="bg-gradient-to-r from-secondary to-accent text-white px-6 py-2.5 rounded-full font-medium transition-all shadow-lg hover:shadow-cyan-500/30 transform hover:-translate-y-0.5 hover:scale-105">Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <header class="header-bg py-24 text-center">
        <div class="max-w-4xl mx-auto px-4" data-aos="fade-down" data-aos-duration="800">
            <h1 class="text-4xl md:text-6xl font-display font-extrabold text-white mb-4 drop-shadow-md">Our Travel <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#38BDF8] via-[#0EA5E9] to-[#F97316]">Packages</span></h1>
            <p class="text-xl text-gray-200 font-light drop-shadow">Find the perfect getaway from our curated premium collection.</p>
        </div>
    </header>

    <!-- Search & Filter Section -->
    <section class="py-8 bg-white border-b border-gray-100 sticky top-20 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-1/2" data-aos="fade-right">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" id="search-pkg" class="block w-full pl-10 pr-3 py-3 border border-gray-200 rounded-lg leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:bg-white focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" placeholder="Search destinations (e.g., 'Bali', 'Swiss')...">
                </div>
                
                <div class="flex gap-4 w-full md:w-auto" data-aos="fade-left">
                    <select id="filter-price" class="block w-full py-3 px-4 border border-gray-200 rounded-lg bg-gray-50 focus:outline-none focus:ring-2 focus:ring-secondary focus:bg-white transition-all text-gray-700">
                        <option value="">Any Price</option>
                        <option value="under300k">Under Rs 300,000</option>
                        <option value="300kto600k">Rs 300,000 - Rs 600,000</option>
                        <option value="over600k">Over Rs 600,000</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <!-- Packages Grid -->
    <section class="py-16 flex-grow bg-gray-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div id="packages-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                <!-- Dynamically populated by app.js -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-primary text-gray-300 pt-12 pb-8 border-t border-gray-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <a href="index.html" class="flex items-center gap-2 text-white group">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary transform group-hover:-translate-y-1 transition-transform">
                        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.5 1.5c-.2.2-.2.6 0 .8L8 13l-3.5 3.5-2.2-.7c-.3-.1-.7 0-.9.2L.4 17c-.2.2-.2.6 0 .8L4 20l2.2 3.6c.2.2.6.2.8 0l1-1c.2-.2.3-.6.2-.9l-.7-2.2L11 16l4 5.8c.2.3.6.4.8.2l1.5-1.5c.3-.2.6-.6.5-1.1z"/>
                    </svg>
                    <span class="font-extrabold text-xl tracking-tight font-display bg-clip-text text-transparent bg-gradient-to-r from-[#38BDF8] via-[#0EA5E9] to-[#F97316]">Voyago</span>
                </a>
                <p>&copy; 2026 Voyago. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- AOS JS -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 50 });
    </script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
