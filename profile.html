<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyago | User Profile</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#3B82F6',
                        accent: '#F97316'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Prevents favicon error on local file -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
        }
        .analytics-card {
            background: linear-gradient(135deg, rgba(255,255,255,1) 0%, rgba(249,250,251,1) 100%);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">
    <!-- Navigation -->
    <nav class="glass-nav sticky top-0 z-[9999] shadow-lg relative pointer-events-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center gap-2 text-white group">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary transform group-hover:-translate-y-1 transition-transform">
                        <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.5 1.5c-.2.2-.2.6 0 .8L8 13l-3.5 3.5-2.2-.7c-.3-.1-.7 0-.9.2L.4 17c-.2.2-.2.6 0 .8L4 20l2.2 3.6c.2.2.6.2.8 0l1-1c.2-.2.3-.6.2-.9l-.7-2.2L11 16l4 5.8c.2.3.6.4.8.2l1.5-1.5c.3-.2.6-.6.5-1.1z"/>
                    </svg>
                    <span class="font-extrabold text-2xl tracking-tight font-display bg-clip-text text-transparent bg-gradient-to-r from-secondary to-accent">Voyago</span>
                </a>
                <div class="hidden md:flex items-center space-x-8 relative z-[9999] pointer-events-auto">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors font-medium">Home</a>
                    <a href="packages.html" class="text-gray-300 hover:text-white transition-colors font-medium">Packages</a>
                    <a href="booking.html" class="text-gray-300 hover:text-white transition-colors font-medium">Booking</a>

                    <div id="nav-auth-section" class="flex items-center gap-4 relative z-[9999] pointer-events-auto">
                        <a href="#" id="logout-btn" class="text-gray-300 hover:text-white font-medium transition-colors">Logout</a>
                        <a href="profile.html" class="bg-secondary text-white px-6 py-2.5 rounded-full font-medium shadow-lg hover:shadow-blue-500/30 transition-all">Profile</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-display font-extrabold text-primary mb-8" id="welcome-message">Loading Profile...</h1>

            <!-- Analytics Dashboard (WOW FEATURE) -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div class="analytics-card p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-14 h-14 bg-blue-100 text-secondary rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 font-medium">Total Spent</p>
                        <h3 class="text-2xl font-bold text-primary" id="total-spent">$0</h3>
                    </div>
                </div>
                
                <div class="analytics-card p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-14 h-14 bg-orange-100 text-accent rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 font-medium">Total Bookings</p>
                        <h3 class="text-2xl font-bold text-primary" id="total-bookings">0</h3>
                    </div>
                </div>

                <div class="analytics-card p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-14 h-14 bg-green-100 text-green-600 rounded-full flex items-center justify-center">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <div>
                        <p class="text-sm text-gray-500 font-medium">Favorite Destination</p>
                        <h3 class="text-xl font-bold text-primary" id="favorite-destination">None yet</h3>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- My Bookings -->
                <div class="lg:col-span-2">
                    <h2 class="text-2xl font-bold text-primary mb-6 border-b pb-2">My Recent Bookings</h2>
                    <div id="user-bookings-list" class="space-y-4">
                        <p class="text-gray-500">Loading your adventures...</p>
                    </div>
                </div>

                <!-- Wishlist -->
                <div>
                    <h2 class="text-2xl font-bold text-primary mb-6 border-b pb-2 flex items-center gap-2">
                        <svg class="w-6 h-6 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        My Wishlist
                    </h2>
                    <div id="user-wishlist" class="space-y-4">
                        <p class="text-gray-500">Loading wishlist...</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-gray-300 pt-12 pb-8 border-t border-gray-800 mt-auto">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <a href="index.html" class="flex items-center gap-2 text-white group">
                    <span class="font-extrabold text-xl tracking-tight font-display bg-clip-text text-transparent bg-gradient-to-r from-secondary to-accent">Voyago</span>
                </a>
                <p>&copy; 2026 Voyago. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/auth.js?v=2"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const API_URL = '/api';

            try {
                // Fetch Profile and Analytics
                const res = await fetch(`${API_URL}/users/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('welcome-message').textContent = `Welcome back, ${data.user.name.split(' ')[0]}!`;
                    
                    document.getElementById('total-spent').textContent = `$${data.analytics.totalSpent.toLocaleString()}`;
                    document.getElementById('total-bookings').textContent = data.analytics.totalBookings;
                    document.getElementById('favorite-destination').textContent = data.analytics.favoriteDestination || 'None';

                    // Populate Wishlist
                    const wishlistContainer = document.getElementById('user-wishlist');
                    if (data.user.wishlist.length === 0) {
                        wishlistContainer.innerHTML = `<p class="text-gray-500 bg-white p-4 rounded-lg border border-gray-100 text-center">Your wishlist is empty.</p>`;
                    } else {
                        wishlistContainer.innerHTML = data.user.wishlist.map(pkg => `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex gap-4 items-center hover:shadow-md transition-shadow">
                                <img src="${pkg.image}" class="w-16 h-16 rounded-lg object-cover" alt="${pkg.name}">
                                <div class="flex-grow">
                                    <h4 class="font-bold text-primary">${pkg.name}</h4>
                                    <p class="text-secondary font-semibold">$${pkg.price}</p>
                                </div>
                                <button onclick="removeFromWishlist('${pkg._id}')" class="text-gray-400 hover:text-red-500 transition-colors">
                                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                                </button>
                            </div>
                        `).join('');
                    }
                }
                
                // Fetch Bookings
                const bookingsRes = await fetch(`${API_URL}/bookings/mybookings`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (bookingsRes.ok) {
                    const bookings = await bookingsRes.json();
                    const bookingsContainer = document.getElementById('user-bookings-list');
                    if (bookings.length === 0) {
                        bookingsContainer.innerHTML = `<p class="text-gray-500 bg-white p-6 rounded-xl border border-gray-100 text-center">You have no upcoming adventures. Time to book one!</p>`;
                    } else {
                        bookingsContainer.innerHTML = bookings.map(b => `
                            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row gap-5 items-start sm:items-center hover:shadow-md transition-shadow">
                                <img src="${b.package ? b.package.image : 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-lg object-cover" alt="Package">
                                <div class="flex-grow">
                                    <h4 class="font-bold text-lg text-primary">${b.package ? b.package.name : 'Unknown Package'}</h4>
                                    <div class="text-sm text-gray-500 flex flex-wrap gap-x-4 gap-y-1 mt-1">
                                        <span class="flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg> ${new Date(b.date).toLocaleDateString()}</span>
                                        <span class="flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg> ${b.people} Travelers</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <span class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-semibold">Confirmed</span>
                                </div>
                            </div>
                        `).join('');
                    }
                }
            } catch (error) {
                console.error("Failed to load profile", error);
            }

            document.getElementById('logout-btn').addEventListener('click', (e) => {
                e.preventDefault();
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            });
        });

        async function removeFromWishlist(packageId) {
            const token = localStorage.getItem('token');
            const API_URL = '/api';
            try {
                await fetch(`${API_URL}/users/wishlist/${packageId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                window.location.reload();
            } catch (error) {
                console.error("Error removing from wishlist", error);
            }
        }
    </script>
    <script src="js/chat-widget.js"></script>
</body>
</html>
