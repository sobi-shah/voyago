<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wanderlust Travel | Book Now</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
                Wanderlust
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="packages.html">Packages</a></li>
                <li><a href="booking.html" class="active">Booking</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <section class="section container">
        <div class="form-card">
            <h2 class="text-center">Book Your Adventure</h2>
            <div id="success-message" class="success-message">Booking submitted successfully! We will contact you soon.</div>
            
            <form id="booking-form">
                <div class="form-group">
                    <label class="form-label" for="fname">Full Name</label>
                    <input type="text" id="fname" class="form-control" required placeholder="John Doe">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" required placeholder="john@example.com">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <input type="tel" id="phone" class="form-control" required placeholder="+1 234 567 890">
                </div>

                <div class="form-group">
                    <label class="form-label" for="package-select">Selected Package</label>
                    <select id="package-select" class="form-control" required>
                        <option value="">-- Choose a Package --</option>
                        <!-- Populated by JS -->
                    </select>
                </div>
                
                <div style="display: flex; gap: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="people">Number of People</label>
                        <input type="number" id="people" class="form-control" min="1" max="20" required value="1">
                    </div>
                    
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label" for="date">Travel Date</label>
                        <input type="date" id="date" class="form-control" required min="2024-01-01">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Confirm Booking</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Wanderlust Travel Agency. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script>
        // Set minimum date to today
        document.getElementById('date').min = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
