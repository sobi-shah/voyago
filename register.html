<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyago | Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#0F172A',
                        secondary: '#0EA5E9',
                        accent: '#F59E0B'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-gray-800 dark:text-white dark:border-gray-700 flex items-center justify-center min-h-screen p-4 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div class="max-w-md w-full bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-primary px-8 py-6 text-center">
            <a href="index.html" class="inline-flex items-center gap-2 text-white mb-2 group">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-secondary transform group-hover:-translate-y-1 transition-transform">
                    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.2-1.1.5l-1.5 1.5c-.2.2-.2.6 0 .8L8 13l-3.5 3.5-2.2-.7c-.3-.1-.7 0-.9.2L.4 17c-.2.2-.2.6 0 .8L4 20l2.2 3.6c.2.2.6.2.8 0l1-1c.2-.2.3-.6.2-.9l-.7-2.2L11 16l4 5.8c.2.3.6.4.8.2l1.5-1.5c.3-.2.6-.6.5-1.1z"/>
                </svg>
                <span class="text-xl font-extrabold tracking-tight font-display bg-clip-text text-transparent bg-gradient-to-r from-[#38BDF8] via-[#0EA5E9] to-[#F97316]">Voyago</span>
            </a>
            <h2 class="text-2xl font-bold text-white mt-4 font-display">Create an Account</h2>
            <p class="text-gray-300 text-sm mt-1">Start your premium travel journey.</p>
        </div>
        
        <div class="p-8">
            <div id="error-msg" class="hidden bg-red-100 text-red-700 p-3 rounded mb-4 text-sm font-medium"></div>
            
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="name">Full Name</label>
                    <input type="text" id="name" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" required placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="email">Email Address</label>
                    <input type="email" id="email" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" required placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="password">Password</label>
                    <input type="password" id="password" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" required placeholder="••••••••">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" class="w-full mt-1 px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-secondary focus:border-secondary transition-all" required placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full bg-gradient-to-r from-secondary to-accent hover:from-blue-400 hover:to-orange-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:shadow-cyan-500/30 transition-all transform hover:-translate-y-0.5 hover:scale-105 mt-6">
                    Sign Up
                </button>
            </form>
            
            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account? <a href="login.html" class="text-secondary hover:underline font-semibold">Sign in</a>
            </p>
        </div>
    </div>
    
    <script src="js/auth.js?v=2"></script>
</body>
</html>
